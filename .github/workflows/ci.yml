name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.6.3-stable

jobs:
  smoke:
    name: Headless import + smoke test
    runs-on: ubuntu-latest
    # The Godot project lives under Game/; run every command from there so `--import`,
    # `res://…`, and `--path .` resolve against Game/project.godot. (working-directory
    # affects `run:` steps only — `actions/*` steps like checkout/upload use repo-root paths.)
    defaults:
      run:
        working-directory: Game
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # pull LFS binaries so imports resolve

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot (headless)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sL -o /tmp/godot.zip "$url"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/godot.zip').extractall('$HOME/godot-bin')"
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Import project (compile scripts)
        run: ~/godot-bin/godot --headless --import

      - name: Run smoke test (CI gate)
        run: ~/godot-bin/godot --headless --script res://tools/ci_smoke_test.gd

      # G5: save-migration gate. Loads the committed v1 meta fixture, migrates to
      # v2, and asserts the migrated state (banked_junk default + field survival +
      # round-trip with .bak). Runs as a scene (autoloads resolve), exits non-zero
      # on any failed assertion → red CI. Add a step/fixture on every schema bump.
      - name: Run save-migration test (release gate)
        run: ~/godot-bin/godot --headless res://tests/test_save_migration.tscn

      # I5 (M1.2): duration regression-lock. Drives 3 sequential start_run loop
      # re-entries (extract → timeout → death) and asserts each run_ended carries a
      # real, independent, nonzero duration_s (telemetry off). The playtest zeros were
      # a missed-stamp on re-entry; red here blocks merge so it can never silently ship.
      - name: Run duration loop-reentry test (CI gate)
        run: ~/godot-bin/godot --headless res://tests/test_duration_loop_reentry.tscn

      # G2: vendored GdUnit4 logic suites (proc-gen determinism, inventory capacity,
      # banking math, death-drop pockets). The CLI runner returns non-zero on any
      # failed/aborted test (100) or orphan-node warning (101), so this gates merge.
      # --ignoreHeadlessMode: our logic suites use no InputEvents, so the headless
      # UI-input guard does not apply. The addon is committed under addons/gdUnit4/,
      # so no editor step is needed. GdUnit4 v6.1.3 (Godot 4.5+; verified on 4.6.3).
      - name: Run GdUnit4 logic tests (CI gate)
        run: |
          ~/godot-bin/godot --headless --path . \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode \
            -a res://tests

      - name: Publish GdUnit4 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-report
          path: Game/reports/**/*.xml
          if-no-files-found: ignore
