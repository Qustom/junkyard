name: nightly-playtest

# G3 / DLV1 — nightly greybox playtest build → itch.io via Butler.
#
# Scheduled nightly (UTC) + manual on-demand. The export/publish job is GATED on a
# test job (decision: gate the nightly on tests passing — blocking a publish when
# parse/tests are already red costs nothing and stops broken nightlies reaching itch;
# the manual loop-smoke checklist is the SECOND line of defence, not the first).
#
# DLV1 (F5): publishes BOTH targets — a Windows build (the proven on-disk telemetry
# vehicle: user:// → %APPDATA%, so testers zip+send run_log.jsonl) AND an HTML5 web
# build (the Director's browser feel-read on the password-gated itch page). The same
# export-templates .tpz carries BOTH platform templates, so web adds only one extra
# export+push step. Web telemetry (user:// → browser IndexedDB) is retrieved by DLV2's
# in-game "Export telemetry" download button — NOT by this workflow.
#
# !!! HUMAN-GATED — this workflow cannot publish until a human provisions: !!!
#   1. BUTLER_API_KEY  — a GitHub repo secret. Generate from itch.io
#        Account > Settings > API Keys, store as repo secret `BUTLER_API_KEY`.
#   2. The itch.io project `qusto/the-far-yard` (personal account; note `qusto`, the
#        itch username, is distinct from the GitHub login `Qustom`), set to
#        Restricted/Draft + a project password so nightlies are private, with
#        Kind = HTML / playable-in-browser. Confirm once with a manual `butler push`
#        (or `bash tools/push_itch.sh`) before relying on the cron.
#   3. The "SharedArrayBuffer support" toggle ON for the HTML5 upload (the threaded
#        web build needs cross-origin isolation). The threaded build is CHROMIUM-ONLY
#        on itch (Firefox lacks the `credentialless` COEP scheme) — play in Chrome/Edge.
#   4. Export TEMPLATES for the pinned Godot version (fetched in the export job; the
#        one .tpz supplies both Windows and web templates).
# Claude did NOT invent a key or a slug — the secret above must be provisioned by a human.

on:
  # DISABLED 2026-07-11 (Director directive): the nightly cron push is STOPPED — the GitHub
  # LFS bandwidth limit was hit. Every run does an `lfs: true` checkout (burns LFS download
  # bandwidth) and the export-and-publish job pushes builds to itch. Manual `workflow_dispatch`
  # is retained so a human can still run it on demand once bandwidth resets. To re-enable the
  # nightly, uncomment the `schedule:` block below.
  #   schedule:
  #     - cron: "0 6 * * *"   # 06:00 UTC nightly
  workflow_dispatch: {}

env:
  GODOT_VERSION: 4.6.3-stable
  # DLV1/F5 real slugs (personal acct). Windows = data vehicle; web = feel read.
  ITCH_TARGET_WIN: "qusto/the-far-yard:win-nightly"
  ITCH_TARGET_WEB: "qusto/the-far-yard:html5"

jobs:
  # ---------------------------------------------------------------------------
  # Gate job: re-run the same import + smoke + save-migration + GdUnit4 gate the
  # CI workflow runs. export-and-publish `needs:` this, so a red gate blocks publish.
  # ---------------------------------------------------------------------------
  test:
    name: Test gate (import + smoke + migration + GdUnit4)
    runs-on: ubuntu-latest
    # The Godot project lives under Game/ — run every command from there.
    defaults:
      run:
        working-directory: Game
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot (headless)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sL -o /tmp/godot.zip "$url"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/godot.zip').extractall('$HOME/godot-bin')"
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      # V8 (M1.12): every headless-test step below is wrapped with a before/after
      # epoch pair, identical mechanism to ci.yml. Wrapped command lines are
      # byte-identical to what they were before V8 — only `date`/`echo`/`exit $_rc`
      # bash scaffolding is added, so pass/fail gating (this job gates
      # export-and-publish via `needs: test`) is untouched. Rationale + scope:
      # design/M1_12_Tasks/V8_ci_wallclock.md.
      - name: Import project (compile scripts)
        run: |
          echo "## Headless suite wall-clock" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          _t0=$(date +%s)
          ~/godot-bin/godot --headless --import
          _rc=$?
          _t1=$(date +%s)
          _dur=$((_t1 - _t0))
          echo "wallclock import ${_dur}s" | tee -a /tmp/ci_wallclock.log
          echo "| import | ${_dur}s |" >> "$GITHUB_STEP_SUMMARY"
          exit $_rc

      # V1-Q4b (delegated to V8, same wave): strengthened junk-catalog validator
      # (res://tools/check_junk_catalog.gd) gates the build. Placed right after
      # import per the task brief.
      - name: Validate junk catalog (CI gate)
        run: |
          _t0=$(date +%s)
          ~/godot-bin/godot --headless --script res://tools/check_junk_catalog.gd
          _rc=$?
          _t1=$(date +%s)
          _dur=$((_t1 - _t0))
          echo "wallclock junk_catalog_check ${_dur}s" | tee -a /tmp/ci_wallclock.log
          echo "| junk_catalog_check | ${_dur}s |" >> "$GITHUB_STEP_SUMMARY"
          exit $_rc

      - name: Smoke test
        run: |
          _t0=$(date +%s)
          ~/godot-bin/godot --headless --script res://tools/ci_smoke_test.gd
          _rc=$?
          _t1=$(date +%s)
          _dur=$((_t1 - _t0))
          echo "wallclock smoke_test ${_dur}s" | tee -a /tmp/ci_wallclock.log
          echo "| smoke_test | ${_dur}s |" >> "$GITHUB_STEP_SUMMARY"
          exit $_rc

      - name: Save-migration test
        run: |
          _t0=$(date +%s)
          ~/godot-bin/godot --headless res://tests/test_save_migration.tscn
          _rc=$?
          _t1=$(date +%s)
          _dur=$((_t1 - _t0))
          echo "wallclock save_migration_test ${_dur}s" | tee -a /tmp/ci_wallclock.log
          echo "| save_migration_test | ${_dur}s |" >> "$GITHUB_STEP_SUMMARY"
          exit $_rc

      - name: Duration loop-reentry regression-lock (I5)
        run: |
          _t0=$(date +%s)
          ~/godot-bin/godot --headless res://tests/test_duration_loop_reentry.tscn
          _rc=$?
          _t1=$(date +%s)
          _dur=$((_t1 - _t0))
          echo "wallclock duration_loop_reentry_test ${_dur}s" | tee -a /tmp/ci_wallclock.log
          echo "| duration_loop_reentry_test | ${_dur}s |" >> "$GITHUB_STEP_SUMMARY"
          exit $_rc

      - name: Loop-drive verification (G3 full-loop gate)
        run: |
          _t0=$(date +%s)
          ~/godot-bin/godot --headless res://tests/test_loop_drive.tscn
          _rc=$?
          _t1=$(date +%s)
          _dur=$((_t1 - _t0))
          echo "wallclock loop_drive_verification ${_dur}s" | tee -a /tmp/ci_wallclock.log
          echo "| loop_drive_verification | ${_dur}s |" >> "$GITHUB_STEP_SUMMARY"
          exit $_rc

      - name: Main-game integration drive (G3 assembled-scene gate)
        run: |
          _t0=$(date +%s)
          ~/godot-bin/godot --headless res://tests/test_main_game_loop.tscn
          _rc=$?
          _t1=$(date +%s)
          _dur=$((_t1 - _t0))
          echo "wallclock main_game_integration_drive ${_dur}s" | tee -a /tmp/ci_wallclock.log
          echo "| main_game_integration_drive | ${_dur}s |" >> "$GITHUB_STEP_SUMMARY"
          exit $_rc

      - name: GdUnit4 logic tests
        run: |
          _t0=$(date +%s)
          ~/godot-bin/godot --headless --path . \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode \
            -a res://tests
          _rc=$?
          _t1=$(date +%s)
          _dur=$((_t1 - _t0))
          echo "wallclock gdunit4_logic_tests ${_dur}s" | tee -a /tmp/ci_wallclock.log
          echo "| gdunit4_logic_tests | ${_dur}s |" >> "$GITHUB_STEP_SUMMARY"
          exit $_rc

      # V8 (M1.12): instrumentation-only, non-gating. Never fails the job (the `||`
      # guards keep this step green even if an earlier step aborted before any
      # timing was captured) — see design/M1_12_Tasks/V8_ci_wallclock.md Resolved
      # Decisions #5. Prints the same per-step lines to the job log (grep-able via
      # `gh run view --log`) AND appends a total row to the job summary table.
      - name: Report suite wall-clock (V8 — instrumentation only, non-gating)
        if: always()
        run: |
          echo "== THE FAR YARD headless suite wall-clock =="
          cat /tmp/ci_wallclock.log || echo "(no timing captured — earlier step may have aborted the job)"
          _total=$(awk '{sum+=$3} END {print sum+0}' /tmp/ci_wallclock.log 2>/dev/null || echo 0)
          echo "TOTAL headless suite wallclock: ${_total}s (commit ${GITHUB_SHA})"
          echo "| **TOTAL** | **${_total}s** |" >> "$GITHUB_STEP_SUMMARY" || true

  # ---------------------------------------------------------------------------
  # Export + publish job: gated on `test`. Builds the Win64 release and pushes to
  # itch via Butler. Skipped automatically if BUTLER_API_KEY is not set (so the
  # workflow does not fail loudly before a human provisions the secret).
  # ---------------------------------------------------------------------------
  export-and-publish:
    name: Export Win64 + Web + publish to itch (Butler)
    needs: test
    runs-on: ubuntu-latest
    # The Godot project lives under Game/ — run every command (stamp, import, export,
    # butler push) from there. git/butler work from the subdir; export paths are
    # project-relative → Game/build/... (the upload-artifact paths below are repo-root).
    defaults:
      run:
        working-directory: Game
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0   # need full history for the git short SHA stamp

      - name: Guard — Butler secret must be provisioned by a human
        id: guard
        run: |
          if [ -z "${{ secrets.BUTLER_API_KEY }}" ]; then
            echo "::warning::BUTLER_API_KEY is not set — skipping publish. A human must add the"
            echo "::warning::repo secret + create the qusto/the-far-yard itch project before nightlies publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot (headless) + export templates
        run: |
          mkdir -p ~/godot-bin
          if [ ! -x ~/godot-bin/godot ]; then
            url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            curl -sL -o /tmp/godot.zip "$url"
            python3 -c "import zipfile; zipfile.ZipFile('/tmp/godot.zip').extractall('$HOME/godot-bin')"
            mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
            chmod +x ~/godot-bin/godot
          fi
          # Export templates MUST match the editor version exactly, or the export
          # fails (the classic headless gotcha). Install them where Godot looks.
          tpl="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          curl -sL -o /tmp/templates.tpz "$tpl"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION//-/.}"
          mkdir -p "$tdir"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/templates.tpz').extractall('/tmp/tpl')"
          mv /tmp/tpl/templates/* "$tdir/"

      - name: Stamp build version (bake git short SHA)
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "BUILD_SHA=$SHA" >> "$GITHUB_ENV"
          echo "USER_VERSION=m1-$(date -u +%Y%m%d)-$SHA" >> "$GITHUB_ENV"
          # I5 (M1.2): write the git-ignored generated artifact (systems/build_info_gen.gd)
          # that BuildVersion reads at runtime. This MUST run BEFORE --import so the
          # generated script is compiled into the project and ships inside the export
          # pack (no git at runtime in an exported build). Replaces the old
          # sed-into-project.godot bake, which BuildVersion no longer reads.
          bash tools/stamp_build.sh

      - name: Import project (build .godot)
        run: ~/godot-bin/godot --headless --import

      - name: Export Win64 (release)
        run: |
          mkdir -p build/win
          ~/godot-bin/godot --headless --path . \
            --export-release "Win64" build/win/TheFarYard.exe
          # A produced binary is NOT proof of a clean export — a partial export can
          # still emit a file. Fail if the expected exe is missing.
          test -f build/win/TheFarYard.exe

      - name: Export Web (HTML5 release)
        run: |
          mkdir -p build/web
          # The same .tpz installed above carries the web template, so no extra fetch.
          ~/godot-bin/godot --headless --path . \
            --export-release "Web" build/web/index.html
          # Require the load-bearing payload (entry + wasm + pck), not just any file —
          # a partial export can still emit index.html.
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck

      - name: Install Butler
        if: steps.guard.outputs.publish == 'true'
        run: |
          curl -sL -o /tmp/butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/butler.zip').extractall('/tmp/butler')"
          chmod +x /tmp/butler/butler
          /tmp/butler/butler -V

      - name: Push Win64 to itch.io (Butler)
        if: steps.guard.outputs.publish == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          /tmp/butler/butler push build/win "${ITCH_TARGET_WIN}" \
            --userversion "${USER_VERSION}"

      - name: Push Web (HTML5) to itch.io (Butler)
        if: steps.guard.outputs.publish == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          # Pushes the build/web DIRECTORY to the :html5 channel; itch tags it
          # playable-in-browser from the channel name on the first push.
          /tmp/butler/butler push build/web "${ITCH_TARGET_WEB}" \
            --userversion "${USER_VERSION}"

      - name: Upload Win64 build artifact (always — usable even without itch)
        uses: actions/upload-artifact@v4
        with:
          name: TheFarYard-Win64-${{ env.USER_VERSION }}
          path: Game/build/win/**
          if-no-files-found: error

      - name: Upload Web build artifact (always — usable even without itch)
        uses: actions/upload-artifact@v4
        with:
          name: TheFarYard-Web-${{ env.USER_VERSION }}
          path: Game/build/web/**
          if-no-files-found: error
