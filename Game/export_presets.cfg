; THE FAR YARD — export presets (G3 / DLV1).
;
; Two presets, both referenced BY NAME from .github/workflows/nightly.yml and the
; local push scripts (`--export-release "Win64" ...`, `--export-release "Web" ...`):
;   preset.0 "Win64" — Windows desktop. The proven M1.0–M1.2 telemetry vehicle:
;     user:// resolves to %APPDATA% on disk, so testers can zip+send run_log.jsonl.
;   preset.1 "Web"   — itch.io HTML5 (DLV1/F5). Pushed to qusto/the-far-yard:html5
;     for the Director's browser feel-read. THREADED build (SharedArrayBuffer) →
;     needs cross-origin isolation: itch's "SharedArrayBuffer support" toggle +
;     the COI service worker (ensure_cross_origin_isolation_headers). On itch the
;     threaded path is CHROMIUM-ONLY (Firefox lacks `credentialless` COEP). A web
;     build's user:// is BROWSER INDEXEDDB, not disk — telemetry retrieval is handled
;     by DLV2's in-game JavaScriptBridge "Export telemetry" download button.
;
; NOTE (human/CI-gated): a real `--export-release` needs the Godot 4.6.3 export
; TEMPLATES (the same .tpz carries BOTH Windows and web templates) installed to the
; editor's templates dir. They are NOT in this repo (large binaries); CI fetches them
; (see nightly.yml) and SETUP.md §1 documents the one-time local install. Without them
; the export fails fast — that is expected, not a malformed preset.

[preset.0]

name="Win64"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="design/*, worklogs/*, tools/playtest/*, tests/*, *.md"
export_path="build/win/TheFarYard.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="The Far Yard"
application/product_name="THE FAR YARD"
application/file_description="THE FAR YARD — M1 greybox playtest build"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="design/*, worklogs/*, tools/playtest/*, tests/*, *.md"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
html/progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
