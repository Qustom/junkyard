; THE FAR YARD — export presets (G3).
;
; One canonical Windows desktop preset, "Win64", referenced by name in
; .github/workflows/nightly.yml (`--export-release "Win64" ...`). Windows is the M1
; playtest target (decision: testers are internal, on Windows; native build gives
; reliable user:// JSONL on disk for the G4 telemetry-return flow). Add a Linux/HTML5
; preset later only if remote/external testers enter the picture.
;
; NOTE (human/CI-gated): a real `--export-release` needs the Godot 4.6.3 Windows
; export TEMPLATES installed to the editor's templates dir. They are NOT in this repo
; (large binaries); CI fetches them (see nightly.yml). Without them the export fails
; fast — that is expected, not a malformed preset.

[preset.0]

name="Win64"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="design/*, worklogs/*, tools/playtest/*, tests/*, *.md"
export_path="build/win/TheFarYard.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="The Far Yard"
application/product_name="THE FAR YARD"
application/file_description="THE FAR YARD — M1 greybox playtest build"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false
